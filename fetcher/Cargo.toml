[package]
name = "feeeed-fetcher"
version = "0.1.0"
edition = "2024"

[lib]
name = "fetcher"
path = "src/lib.rs"

[[bin]]
name = "fetcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
html-escape = "0.2"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
pretty_assertions = "1"
wiremock = "0.6"
