services:
  web:
    build: .
    command: bin/rails s -p 3111 -b '0.0.0.0'
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3111:3111"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - database
  database:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=password
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
  worker:
    build: .
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    depends_on:
      - database
    command: bin/jobs
  dispatcher:
    image: node:24
    working_dir: /app/dispatcher
    volumes:
      - .:/app
      - dispatcher_node_modules:/app/dispatcher/node_modules
    environment:
      TEST_DATABASE_URL: postgres://postgres:password@database:5432/feeeed_test
    depends_on:
      - database
volumes:
  bundle:
  dispatcher_node_modules:
